<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketsa 3D Standing Photobooth Frame - Clean Design</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #canvas-container { width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.88);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 12px;
      pointer-events: none;
      line-height: 1.6;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .hud b { color: #00f3ff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="hud">
    <b>DATA DIMENSI & UKURAN FRAME</b><br>
    • Ukuran Total Frame: <b>122 cm × 200 cm × 2 cm</b><br>
    • Ukuran Lubang Foto: <b>82 cm × 110 cm</b><br>
    • Elevasi Lubang Foto: <b>65 cm – 175 cm dari lantai</b><br>
    • Margin Kiri & Kanan: <b>20 cm / sisi</b><br>
    • Margin Atas: <b>25 cm</b> (SCF 2027)<br>
    • Margin Bawah: <b>65 cm</b> (belom ada tema + design)
  </div>
  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');

    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0f19');

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.8, 1.8, 3.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.0, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // 2. Lighting Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.3);
    dirLight.position.set(5, 8, 6);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.45);
    fillLight.position.set(-5, 4, -4);
    scene.add(fillLight);

    // Floor Grid
    const grid = new THREE.GridHelper(8, 16, 0x00f3ff, 0x1e293b);
    scene.add(grid);

    // 3. Texture Generator untuk Muka Depan Frame Triplek (Clean & Tanpa Hashtag)
    function createFrontGraphicTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1220; // Scale: 10 px per cm
      canvas.height = 2000;
      const ctx = canvas.getContext('2d');

      // Latar Dasar Papan Triplek Putih Krem Clean
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, 1220, 2000);

      // Garis Tepi Frame Luar
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 12;
      ctx.strokeRect(20, 20, 1180, 1960);

      // Area Lubang Foto (Margin Kiri/Kanan: 20cm, Margin Atas: 25cm, Tinggi Lubang: 110cm)
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 10;
      ctx.strokeRect(200, 250, 820, 1100);

      // --- MARGIN ATAS (25 cm): TULISAN "SCF 2027" ---
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.fillStyle = '#0284c7';
      ctx.font = 'bold 110px -apple-system, sans-serif';
      ctx.fillText('SCF 2027', 610, 130);

      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 34px -apple-system, sans-serif';
      ctx.fillText('SMAGA CAMPUS FESTIVAL', 610, 205);

      // --- MARGIN SAMPING KIRI & KANAN (20 cm) ---
      ctx.fillStyle = '#38bdf8';
      for(let y = 350; y <= 1250; y += 150) {
        ctx.beginPath();
        ctx.arc(100, y, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(1120, y, 12, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- MARGIN BAWAH (65 cm): AREA "belom ada tema + design" ---
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(80, 1420, 1060, 480);

      ctx.fillStyle = '#00f3ff';
      ctx.font = 'bold 64px -apple-system, sans-serif';
      ctx.fillText('belom ada tema + design', 610, 1620);

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 36px -apple-system, sans-serif';
      ctx.fillText('[ DRAFT FRAME DESIGN 122 x 200 cm ]', 610, 1720);

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 4;
      return texture;
    }

    // 4. Materials
    const matWoodSide = new THREE.MeshStandardMaterial({
      color: 0xd97706, // Warna kayu triplek / plywood
      roughness: 0.7,
      metalness: 0.1
    });

    const matWoodFrameBack = new THREE.MeshStandardMaterial({
      color: 0x92400e,
      roughness: 0.8
    });

    const matGraphicFront = new THREE.MeshStandardMaterial({
      map: createFrontGraphicTexture(),
      roughness: 0.4
    });

    const lineCyan = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 1.5 });
    const lineRed = new THREE.LineBasicMaterial({ color: 0xf43f5e, linewidth: 1.5 });
    const lineDark = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 1.2 });
    const lineDim = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 1.5 });

    function createWireMesh(geo, mat, edgeMat = lineCyan) {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, edgeMat);
      mesh.add(line);
      return mesh;
    }

    // 5. STRUKTUR FRAME TRIPLEK DENGAN LUBANG JENDELA (Extrude Shape)
    const W = 1.22; // Lebar 122 cm
    const H = 2.00; // Tinggi 200 cm
    const T = 0.02; // Tebal triplek 2 cm

    const holeW = 0.82;
    const holeH = 1.10;
    const holeBottomY = 0.65;

    const frameShape = new THREE.Shape();
    frameShape.moveTo(-W / 2, 0);
    frameShape.lineTo( W / 2, 0);
    frameShape.lineTo( W / 2, H);
    frameShape.lineTo(-W / 2, H);
    frameShape.closePath();

    const holePath = new THREE.Path();
    holePath.moveTo(-holeW / 2, holeBottomY);
    holePath.lineTo( holeW / 2, holeBottomY);
    holePath.lineTo( holeW / 2, holeBottomY + holeH);
    holePath.lineTo(-holeW / 2, holeBottomY + holeH);
    holePath.closePath();
    frameShape.holes.push(holePath);

    const extrudeSettings = {
      depth: T,
      bevelEnabled: false
    };

    const frameGeo = new THREE.ExtrudeGeometry(frameShape, extrudeSettings);
    const frameMesh = new THREE.Mesh(frameGeo, [matWoodSide, matWoodSide]);
    frameMesh.position.set(0, 0, -T / 2);
    frameMesh.castShadow = true;
    frameMesh.receiveShadow = true;
    scene.add(frameMesh);

    const frameEdges = new THREE.EdgesGeometry(frameGeo);
    const frameEdgeLine = new THREE.LineSegments(frameEdges, lineCyan);
    frameMesh.add(frameEdgeLine);

    // Lapisan Muka Depan Bergrafis
    // A. Panel Atas (25 cm)
    const topPanelGeo = new THREE.PlaneGeometry(W, 0.25);
    const topPanel = new THREE.Mesh(topPanelGeo, matGraphicFront);
    topPanelGeo.attributes.uv.setXY(0, 0, 1);
    topPanelGeo.attributes.uv.setXY(1, 1, 1);
    topPanelGeo.attributes.uv.setXY(2, 0, 0.875);
    topPanelGeo.attributes.uv.setXY(3, 1, 0.875);
    topPanel.position.set(0, 1.875, T / 2 + 0.001);
    scene.add(topPanel);

    // B. Panel Bawah (65 cm)
    const bottomPanelGeo = new THREE.PlaneGeometry(W, 0.65);
    const bottomPanel = new THREE.Mesh(bottomPanelGeo, matGraphicFront);
    bottomPanelGeo.attributes.uv.setXY(0, 0, 0.325);
    bottomPanelGeo.attributes.uv.setXY(1, 1, 0.325);
    bottomPanelGeo.attributes.uv.setXY(2, 0, 0);
    bottomPanelGeo.attributes.uv.setXY(3, 1, 0);
    bottomPanel.position.set(0, 0.325, T / 2 + 0.001);
    scene.add(bottomPanel);

    // C. Panel Sayap Kiri (20 cm)
    const leftPanelGeo = new THREE.PlaneGeometry(0.20, 1.10);
    const leftPanel = new THREE.Mesh(leftPanelGeo, matGraphicFront);
    leftPanelGeo.attributes.uv.setXY(0, 0, 0.875);
    leftPanelGeo.attributes.uv.setXY(1, 0.164, 0.875);
    leftPanelGeo.attributes.uv.setXY(2, 0, 0.325);
    leftPanelGeo.attributes.uv.setXY(3, 0.164, 0.325);
    leftPanel.position.set(-0.51, 1.20, T / 2 + 0.001);
    scene.add(leftPanel);

    // D. Panel Sayap Kanan (20 cm)
    const rightPanelGeo = new THREE.PlaneGeometry(0.20, 1.10);
    const rightPanel = new THREE.Mesh(rightPanelGeo, matGraphicFront);
    rightPanelGeo.attributes.uv.setXY(0, 0.836, 0.875);
    rightPanelGeo.attributes.uv.setXY(1, 1, 0.875);
    rightPanelGeo.attributes.uv.setXY(2, 0.836, 0.325);
    rightPanelGeo.attributes.uv.setXY(3, 1, 0.325);
    rightPanel.position.set(0.51, 1.20, T / 2 + 0.001);
    scene.add(rightPanel);

    // 6. RANGKA PENOPANG KAYU BELAKANG (A-Frame Stand)
    const rearStandGroup = new THREE.Group();

    [-0.51, 0.51].forEach(x => {
      const battenGeo = new THREE.BoxGeometry(0.04, 2.00, 0.04);
      const batten = createWireMesh(battenGeo, matWoodFrameBack, lineDark);
      batten.position.set(x, 1.00, -T / 2 - 0.02);
      rearStandGroup.add(batten);

      const legGeo = new THREE.BoxGeometry(0.04, 1.65, 0.04);
      const leg = createWireMesh(legGeo, matWoodFrameBack, lineDark);
      leg.rotation.x = -0.38;
      leg.position.set(x, 0.75, -0.36);
      rearStandGroup.add(leg);

      const baseFootGeo = new THREE.BoxGeometry(0.04, 0.03, 0.80);
      const baseFoot = createWireMesh(baseFootGeo, matWoodFrameBack, lineDark);
      baseFoot.position.set(x, 0.015, -0.38);
      rearStandGroup.add(baseFoot);
    });

    const crossBarGeo = new THREE.BoxGeometry(1.06, 0.04, 0.04);
    const crossBar1 = createWireMesh(crossBarGeo, matWoodFrameBack, lineDark);
    crossBar1.position.set(0, 0.50, -T / 2 - 0.02);
    rearStandGroup.add(crossBar1);

    const crossBar2 = createWireMesh(crossBarGeo, matWoodFrameBack, lineDark);
    crossBar2.position.set(0, 1.80, -T / 2 - 0.02);
    rearStandGroup.add(crossBar2);

    scene.add(rearStandGroup);

    // 7. GARIS INDIKATOR DIMENSI TEKNIS
    const dimWGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-W/2, -0.06, T/2 + 0.05),
      new THREE.Vector3( W/2, -0.06, T/2 + 0.05)
    ]);
    scene.add(new THREE.Line(dimWGeo, lineRed));

    const dimHoleWGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-holeW/2, holeBottomY + 0.04, T/2 + 0.05),
      new THREE.Vector3( holeW/2, holeBottomY + 0.04, T/2 + 0.05)
    ]);
    scene.add(new THREE.Line(dimHoleWGeo, lineCyan));

    const dimHoleHGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(holeW/2 - 0.04, holeBottomY, T/2 + 0.05),
      new THREE.Vector3(holeW/2 - 0.04, holeBottomY + holeH, T/2 + 0.05)
    ]);
    scene.add(new THREE.Line(dimHoleHGeo, lineCyan));

    const dimHGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(W/2 + 0.08, 0, T/2),
      new THREE.Vector3(W/2 + 0.08, H, T/2)
    ]);
    scene.add(new THREE.Line(dimHGeo, lineDim));

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
