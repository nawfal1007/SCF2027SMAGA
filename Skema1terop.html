<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketsa 3D Penataan Meja Segitiga Terop 6x4m</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #canvas-container { width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 12px;
      pointer-events: none;
      line-height: 1.5;
    }
    .hud b { color: #00f3ff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="hud">
    <b>TEROP 6.00 m × 4.00 m</b> (Format Segitiga / U-Shape)<br>
    • Kiri: Stand Univ A (Hadap Tengah)<br>
    • Belakang: Stand Univ B (Hadap Depan)<br>
    • Kanan: Stand Univ C (Hadap Tengah)
  </div>
  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');

    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0f19');

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(7.5, 6.5, 9.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.2, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // 2. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
    dirLight.position.set(8, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
    fillLight.position.set(-8, 6, -6);
    scene.add(fillLight);

    // Floor Grid
    const grid = new THREE.GridHelper(14, 14, 0x00f3ff, 0x1e293b);
    scene.add(grid);

    // 3. Materials
    const matTentWall = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.12,
      roughness: 0.2,
      side: THREE.DoubleSide
    });
    const matTentFrame = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 });
    const matTable = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.4, metalness: 0.2 });
    const matChair = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });
    const matFloorAtrium = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const lineEdgeMat = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 1.5 });
    const lineFlowMat = new THREE.LineBasicMaterial({ color: 0xe11d48, linewidth: 2 });

    function createWireMesh(geo, mat, edgeMat = lineEdgeMat) {
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, edgeMat);
      mesh.add(line);
      return mesh;
    }

    // 4. TEROP CANOPY STRUCTURE (6.0m Width x 4.0m Depth x 3.0m Height)
    const tW = 6.0, tD = 4.0, tHeave = 2.5, tHridge = 3.2;

    // Tent Floor
    const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(tW, tD), matFloorAtrium);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = 0.005;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Tent Wireframe Rafters & Posts
    const halfW = tW / 2;
    const halfD = tD / 2;

    // Corner Posts
    [[-halfW, -halfD], [halfW, -halfD], [halfW, halfD], [-halfW, halfD]].forEach(([x, z]) => {
      const postGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, 0, z),
        new THREE.Vector3(x, tHeave, z)
      ]);
      scene.add(new THREE.Line(postGeo, matTentFrame));
    });

    // Pitched Roof Outline
    const roofPoints = [
      new THREE.Vector3(-halfW, tHeave, halfD),
      new THREE.Vector3(halfW, tHeave, halfD),
      new THREE.Vector3(halfW, tHeave, -halfD),
      new THREE.Vector3(-halfW, tHeave, -halfD),
      new THREE.Vector3(-halfW, tHeave, halfD), // Perimeter

      new THREE.Vector3(0, tHridge, halfD),     // Front Gable
      new THREE.Vector3(halfW, tHeave, halfD),

      new THREE.Vector3(halfW, tHeave, -halfD), // Right to Back Ridge
      new THREE.Vector3(0, tHridge, -halfD),    // Back Gable
      new THREE.Vector3(-halfW, tHeave, -halfD),
      new THREE.Vector3(0, tHridge, -halfD),
      new THREE.Vector3(0, tHridge, halfD)      // Ridge line
    ];
    const roofGeo = new THREE.BufferGeometry().setFromPoints(roofPoints);
    scene.add(new THREE.Line(roofGeo, matTentFrame));

    // Semi-transparent Roof Panels
    const roofL = new THREE.BufferGeometry();
    roofL.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -halfW, tHeave, -halfD,   0, tHridge, -halfD,   0, tHridge, halfD,
      -halfW, tHeave, -halfD,   0, tHridge, halfD,   -halfW, tHeave, halfD
    ]), 3));
    roofL.computeVertexNormals();
    scene.add(new THREE.Mesh(roofL, matTentWall));

    const roofR = new THREE.BufferGeometry();
    roofR.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      0, tHridge, -halfD,   halfW, tHeave, -halfD,   halfW, tHeave, halfD,
      0, tHridge, -halfD,   halfW, tHeave, halfD,    0, tHridge, halfD
    ]), 3));
    roofR.computeVertexNormals();
    scene.add(new THREE.Mesh(roofR, matTentWall));

    // 5. BOOTH MODULE GENERATOR (Meja 1.2m x 0.5m x 0.75m + 2 Kursi)
    function createStand(x, z, rotY) {
      const stand = new THREE.Group();

      // Meja Stand (1.2m W x 0.5m D x 0.75m H)
      const tableGeo = new THREE.BoxGeometry(1.2, 0.75, 0.5);
      const tableMesh = createWireMesh(tableGeo, matTable);
      tableMesh.position.set(0, 0.75 / 2, 0);
      stand.add(tableMesh);

      // 2 Kursi Alumni di Belakang Meja
      [-0.3, 0.3].forEach(cx => {
        const chair = new THREE.Group();
        // Dudukan Kursi
        const seat = createWireMesh(new THREE.BoxGeometry(0.38, 0.04, 0.38), matChair);
        seat.position.set(0, 0.45, 0);
        chair.add(seat);
        // Sandaran Kursi
        const back = createWireMesh(new THREE.BoxGeometry(0.38, 0.4, 0.03), matChair);
        back.position.set(0, 0.65, -0.17);
        chair.add(back);
        // Kaki Kursi
        const legGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.45, 8);
        [[-0.16, -0.16], [0.16, -0.16], [0.16, 0.16], [-0.16, 0.16]].forEach(([lx, lz]) => {
          const leg = new THREE.Mesh(legGeo, matChair);
          leg.position.set(lx, 0.225, lz);
          chair.add(leg);
        });

        chair.position.set(cx, 0, -0.55);
        stand.add(chair);
      });

      // Flow Indikator Panah Hadap Pengunjung
      const arrGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0.05, 0.3),
        new THREE.Vector3(0, 0.05, 0.85)
      ]);
      stand.add(new THREE.Line(arrGeo, lineFlowMat));

      stand.position.set(x, 0, z);
      stand.rotation.y = rotY;
      scene.add(stand);
    }

    // 6. PENEMPATAN 3 STAN SUDUT SEGITIGA
    // Stand 1: Sisi Kiri (Menempel dinding kiri x=-2.4, hadap ke kanan/tengah)
    createStand(-2.3, 0.2, Math.PI / 2);

    // Stand 2: Sisi Belakang (Menempel dinding belakang z=-1.4, hadap ke depan)
    createStand(0, -1.4, 0);

    // Stand 3: Sisi Kanan (Menempel dinding kanan x=2.4, hadap ke kiri/tengah)
    createStand(2.3, 0.2, -Math.PI / 2);

    // Responsive Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
